# Production stack. Does not replace docker-compose.yml (local Postgres/Redis).
#
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# TLS is expected at nginx/Caddy/a cloud load balancer in front of the frontend.

name: url-shortner-prod

networks:
  app:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "3000"
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  BASE_URL: ${BASE_URL:?Set BASE_URL to the public HTTPS origin, e.g. https://your-domain.com}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
  DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=128MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=1GB
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        "sh",
        "-c",
        "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\"",
      ]
    volumes:
      - redis_prod_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: url-shortner-backend:prod
    restart: "no"
    environment:
      <<: *backend-env
    command: ["npm", "run", "migrate:up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: url-shortner-backend:prod
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: url-shortner-frontend:prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
